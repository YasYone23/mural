<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mural da Sede — Secretaria de Administração</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f9ec;--ink:#1d2b2a;--mut:#58706a;--c1:#4f9f26;--c2:#1f8ea3;--c3:#f5a21a;--glass:rgba(255,255,255,.84);--bd:rgba(70,150,80,.3);--ln:rgba(90,174,46,.10);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Sora,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none}
body::before{background:radial-gradient(45vmax 35vmax at 12% 8%,rgba(110,190,60,.28),transparent),radial-gradient(45vmax 40vmax at 92% 85%,rgba(72,192,192,.28),transparent),radial-gradient(30vmax 25vmax at 88% 6%,rgba(245,162,26,.18),transparent);background-size:130% 130%}
body::after{background-image:linear-gradient(var(--ln) 1px,transparent 1px),linear-gradient(90deg,var(--ln) 1px,transparent 1px);background-size:52px 52px;-webkit-mask-image:radial-gradient(circle at 50% 25%,#000,transparent 80%);mask-image:radial-gradient(circle at 50% 25%,#000,transparent 80%)}
@media(prefers-reduced-motion:no-preference){
body::before{animation:drift 18s ease-in-out infinite alternate}body::after{animation:grid 6s linear infinite}
.card{animation:in .7s both;animation-delay:calc(var(--i,0)*80ms)}
.hoje{animation:in .7s both,glow 2s ease-in-out infinite!important}
.av::before{animation:spin 5s linear infinite}
.banner::after{animation:sheen 4s ease-in-out infinite}
.dot{animation:pulse 1.4s infinite}
#tick .trk{animation:mq var(--d,60s) linear infinite}
}
@keyframes drift{to{background-position:100% 100%}}@keyframes grid{to{background-position:52px 52px}}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.97)}}@keyframes spin{to{transform:rotate(1turn)}}
@keyframes glow{50%{box-shadow:0 0 26px var(--c3)}}@keyframes sheen{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
@keyframes pulse{50%{opacity:.25}}@keyframes mq{to{transform:translateX(-50%)}}@keyframes prog{from{width:0}to{width:100%}}
h1,h2,h3{margin:0}
header{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:16px 24px;border-bottom:4px solid;border-image:linear-gradient(90deg,#6ebe3c,#48c0c0,#f5a21a) 1;background:var(--glass);backdrop-filter:blur(10px)}
.brand{display:flex;gap:14px;align-items:center}
.logo{height:84px;width:auto;object-fit:contain}
div.logo{height:56px;width:56px;border:2px solid var(--c1);border-radius:14px;display:grid;place-items:center;font-weight:800;color:var(--c1)}
header h1{font-size:1.35rem;font-weight:800;letter-spacing:.01em}
header small{color:var(--mut);display:block}
#clock{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c1);margin-right:6px;box-shadow:0 0 10px var(--c1)}
nav{display:flex;gap:8px;padding:12px 24px;flex-wrap:wrap;align-items:center}
.btn,nav button{font:inherit;font-size:.9rem;border:1px solid var(--bd);background:var(--glass);color:var(--ink);padding:8px 15px;border-radius:999px;cursor:pointer}
nav button.on,.btn.p{background:linear-gradient(90deg,var(--c1),var(--c2));color:#fff;border-color:transparent;font-weight:600}
nav .sp{flex:1}
main{padding:8px 24px 32px;max-width:1280px;margin:auto}
h2{font-size:1.6rem;font-weight:800;margin:6px 0 16px;display:flex;gap:12px;align-items:baseline}
h2 small{font-size:.9rem;color:var(--mut);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{box-shadow:0 6px 20px rgba(40,120,80,.09);position:relative;background:var(--glass);border:1px solid var(--bd);border-radius:14px;padding:16px;backdrop-filter:blur(8px)}
.card::before,.card::after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--c1)}
.card::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.card::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-radius:0 0 14px 0}
.hoje{border-color:var(--c3);background:#fff6e2}
.av-card{display:flex;gap:16px;align-items:center}
.av{position:relative;flex:none;width:88px;height:88px;border-radius:50%}
.av::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--c1),var(--c2),var(--c3),var(--c1))}
.av img,.av span{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);border-radius:50%;object-fit:cover;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:1.4rem;color:var(--c1)}
.day{font-size:1.9rem;font-weight:800;color:var(--c1);line-height:1}
.mut{color:var(--mut);font-size:.9rem}
.ph{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:9px;margin-bottom:10px;border:1px solid var(--bd)}
.card h3{font-size:1.1rem}.card p{margin:.4em 0 0}
.banner{position:relative;overflow:hidden;border-radius:16px;padding:20px 26px;margin-bottom:18px;color:#fff;background:linear-gradient(110deg,var(--cc),color-mix(in srgb,var(--cc) 45%,#000))}
.banner h3{font-size:1.8rem;font-weight:800}
.banner::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent)}
.tel{font-size:1.3rem;font-weight:800;color:var(--c1)}
.tree{display:flex;flex-direction:column;align-items:center}
.root{display:flex;gap:12px;align-items:center;padding:12px 26px;border-radius:14px;border:1px solid var(--c1);background:var(--glass);font-weight:800;font-size:1.15rem}
.root .logo{height:60px}
.stem{width:2px;height:26px;background:linear-gradient(var(--c1),var(--c2))}
.secs{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;border-top:2px solid var(--c1);padding-top:22px;width:100%}
.sec{width:290px}.sec h3{color:var(--c1)}.sec ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.sec li{padding-left:10px;border-left:2px solid var(--c2)}.loc{color:var(--mut);font-size:.85rem}
.ctl{position:absolute;top:8px;right:10px;display:flex;gap:4px;z-index:2}
.ctl button{border:1px solid var(--bd);background:var(--bg);color:var(--ink);border-radius:6px;cursor:pointer}
