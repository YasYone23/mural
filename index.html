:root{--g1:#0a4d33;--g2:#117a4d;--g3:#2fb36d;--au:#c9a227;--bg:#eef5f0;--card:#fff;--tx:#14261d;--mu:#5d7567;--bd:#d6e5db;--tint:#e5f1e9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1913;--card:#14251c;--tx:#e8f2ea;--mu:#97ad9f;--bd:#254034;--tint:#1b3428}}
:root[data-theme="dark"]{--bg:#0d1913;--card:#14251c;--tx:#e8f2ea;--mu:#97ad9f;--bd:#254034;--tint:#1b3428}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;font-family:Manrope,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
header{background:linear-gradient(120deg,#0a4d33,#117a4d 60%,#2fb36d);color:#fff;border-radius:26px;padding:22px 28px;display:flex;align-items:center;gap:28px;box-shadow:0 12px 32px rgba(10,77,51,.28);position:relative;overflow:hidden}
header:after{content:"";position:absolute;right:-70px;top:-70px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.07)}
header img{height:140px;width:auto;background:#fff;border-radius:22px;padding:12px 26px;flex:none;position:relative;z-index:1;box-shadow:0 10px 26px rgba(0,0,0,.25)}
header div{position:relative;z-index:1}header small{letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#cfe5d8;font-size:12px}
header h1{margin:6px 0 4px;font-family:Fraunces,Georgia,serif;font-size:36px;line-height:1.1}header p{margin:0;color:#d9efe2}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;margin-top:16px}
.sb{display:grid;grid-template-columns:1fr auto auto auto;gap:10px}
input,select,button{font:inherit;padding:12px 14px;border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx)}
#q{font-size:16px;border-color:var(--g3);border-width:2px}button{cursor:pointer;font-weight:700}.b1{background:var(--g2);color:#fff;border:0}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:var(--mu);font-size:14px;margin:14px 2px 0}
.it{display:grid;grid-template-columns:150px 1fr auto;gap:16px;align-items:center;background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--g3);border-radius:18px;padding:16px 18px;margin-top:12px}
.it .n{font-family:Fraunces,Georgia,serif;font-size:26px;font-weight:700;color:var(--g1)}.it .d{color:var(--mu);font-size:13px}
.it h3{margin:0 0 4px;font-size:16px}.it p{margin:0;color:var(--mu);font-size:14px}
.bg{display:inline-block;padding:3px 11px;border-radius:20px;font-size:12px;font-weight:700;margin-top:6px}.ok{background:#d6f3e1;color:#0b5d3b}.wa{background:#fff0c2;color:#7a5a00}.in{background:#dfe9f5;color:#254a78}
a.ab{background:var(--tint);color:var(--g1);text-decoration:none;font-weight:700;padding:10px 14px;border-radius:12px;white-space:nowrap}
.vz{text-align:center;color:var(--mu);padding:30px}
footer{text-align:center;color:var(--mu);font-size:13px;padding:22px 0 8px}
@media (max-width:760px){header{flex-direction:column;align-items:flex-start;padding:18px}header img{height:100px}header h1{font-size:26px}.sb{grid-template-columns:1fr 1fr}#q{grid-column:1/-1}.it{grid-template-columns:1fr}.it .n{font-size:22px}}

.tabs{display:flex;gap:8px;margin-top:16px}.tabs button{background:var(--card);border:1px solid var(--bd);color:var(--tx);padding:11px 22px;border-radius:14px}.tabs .on{background:var(--g2);color:#fff;border-color:var(--g2)}
h2{font-family:Fraunces,Georgia,serif;margin:0 0 12px;font-size:22px;color:var(--g1)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg label{display:grid;gap:4px;font-size:13px;color:var(--mu)}.fg input,.fg select{width:100%}
.bt{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.bt button{background:var(--tint);color:var(--g1);border:0}.bt .b1{background:var(--g2);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--mu);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:8px;border-bottom:2px solid var(--au)}td{padding:9px 8px;border-bottom:1px solid var(--bd)}td button{padding:5px 10px;border-radius:10px;background:var(--tint);color:var(--g1);border:0;margin-right:4px}td .dg{background:#fbd9d4;color:#8a1f10}
.ox{overflow-x:auto}.pbx{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.er{color:#8a1f10;font-weight:700}textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx)}

const HEAD=()=>`<header><img src="${LOGO}" alt="Prefeitura de São José do Egito"><div><small>Secretaria de Administração</small><h1>Sistema de Busca de Portarias</h1><p>Pesquise por número, assunto, servidor ou responsável</p></div></header>`;

const isAdm=()=>SESS&&SESS.r=='admin';const canPub=()=>ART&&WR;const CANSETUP=()=>WR||location.protocol=='file:';

if(!DATA.users.length){A.innerHTML=`<div class="wrap">${HEAD()}${CANSETUP()?`<div class="card lg"><h2>Configuração inicial</h2><p class="mu">Crie o login e a senha do administrador. Esta senha protege todos os dados: guarde-a bem, ela não pode ser recuperada.</p><label>Login do administrador<input id="su" autocomplete="username"></label><label>Senha (mínimo 8 caracteres)<input id="sp" type="password" autocomplete="new-password"></label><label>Repita a senha<input id="sp2" type="password" autocomplete="new-password"></label><button class="b1" onclick="criarAdmin()">Criar administrador</button><p id="lm" class="mu"></p></div>`:'<div class="card"><p>Sistema em configuração. Volte em instantes.</p></div>'}${FOOT()}</div>`;return}
if(!P){A.innerHTML=`<div class="wrap">${HEAD()}<div class="card lg"><h2>Acesso restrito</h2><p class="mu" style="margin:0">Entre com o login e a senha fornecidos pela Secretaria de Administração.</p><label>Login<input id="lu" autocomplete="username" onkeydown="if(event.key=='Enter')$('#lp').focus()"></label><label>Senha<input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')entrar()"></label><button class="b1" onclick="entrar()">Entrar</button><p id="lm" class="mu"></p></div>${FOOT()}</div>`;return}
if(tab=='a'&&!isAdm())tab='c';
A.innerHTML=`<div class="wrap">${HEAD()}<div class="who"><span>Conectado como <b>${esc(SESS.u)}</b>${SESS.r=='admin'?' (administrador)':''}</span><button onclick="sair()">Sair</button></div>${isAdm()?`<nav class="tabs"><button class="${tab=='c'?'on':''}" onclick="go('c')">Consulta</button><button class="${tab=='a'?'on':''}" onclick="go('a')">Administração</button></nav>`:''}<div id="pane"></div>${FOOT()}</div>`;
tab=='a'?adminView():consultView()}
function setL(t,er){const e=$('#lm');if(e){e.textContent=t;e.className=er?'er':'mu'}}
async function entrar(){const u=nu($('#lu').value),pw=$('#lp').value;setL('Verificando…');
try{const e=DATA.users.find(x=>x.u==u);if(!e)throw 0;const raw=await aesD(await pk(pw,ub(e.salt),e.it),e);DK=await impK(raw);loadP(JSON.parse(dec.decode(await aesD(DK,DATA.p))));SESS={u,r:e.r};try{sessionStorage.setItem('cp_k',b64(raw));sessionStorage.setItem('cp_u',u);sessionStorage.setItem('cp_r',e.r)}catch(_){}tab='c';shell()}
catch(x){DK=null;P=null;SESS=null;setL('Login ou senha inválidos.',1)}}
function sair(){DK=null;P=null;SESS=null;try{sessionStorage.clear()}catch(e){}shell()}
async function criarAdmin(){const u=nu($('#su').value),pw=$('#sp').value;if(!u){setL('Informe o login.',1);return}if(pw.length<8){setL('A senha precisa ter pelo menos 8 caracteres.',1);return}if(pw!=$('#sp2').value){setL('As senhas não conferem.',1);return}
setL('Criando…');DK=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']);const raw=await crypto.subtle.exportKey('raw',DK);loadP({items:(DATA.legacy&&DATA.legacy.items)||[],upd:today(),at:new Date().toISOString()});delete DATA.legacy;DATA.users=[await mkUser(u,pw,'admin',raw)];SESS={u,r:'admin'};try{sessionStorage.setItem('cp_k',b64(raw));sessionStorage.setItem('cp_u',u);sessionStorage.setItem('cp_r','admin')}catch(_){}await pub();tab='c';shell()}
function consultView(){const anos=[...new Set(P.items.map(yr).filter(Boolean))].sort().reverse(),sits=[...new Set(P.items.map(p=>p.sit).filter(Boolean))];
$('#pane').innerHTML=`<div class="card"><div class="sb"><input id="q" type="search" placeholder="Digite para buscar… (ex.: 045/2026, designação, nome do servidor)" autocomplete="off"><select id="an"><option value="">Todos os anos</option>${anos.map(a=>`<option>${esc(a)}</option>`).join('')}</select><select id="st"><option value="">Todas as situações</option>${sits.map(a=>`<option>${esc(a)}</option>`).join('')}</select><button id="od" class="b1" title="Inverter a ordem pelo número da portaria"></button></div><div class="meta"><span id="ct"></span><span>Ordenadas pelo número da portaria · <a href="#" onclick="limpar();return false">limpar busca</a></span></div></div><div id="ls"></div><div class="vz" id="mais" style="display:none"><button class="b1" id="bm">Mostrar mais</button></div>`;
['input','keyup','search'].forEach(ev=>$('#q').addEventListener(ev,()=>{lim=40;draw()}));$('#an').onchange=$('#st').onchange=()=>{lim=40;draw()};$('#od').onclick=()=>{asc=!asc;draw()};$('#bm').onclick=()=>{lim+=40;draw()};draw()}
function limpar(){$('#q').value='';$('#an').value='';$('#st').value='';lim=40;draw()}
function draw(){const ts=nm($('#q').value).split(/\s+/).filter(Boolean),a=$('#an').value,s=$('#st').value;
let l=P.items.filter(p=>(!a||yr(p)==a)&&(!s||p.sit==s)&&ts.every(t=>nm([p.num,p.ass,p.env,p.resp,p.sit,dt(p.data)].join(' ')).includes(t)));
l.sort((x,y)=>(nk(x.num)-nk(y.num)||String(x.data).localeCompare(String(y.data)))*(asc?1:-1));
$('#od').textContent=asc?'Número ↑ crescente':'Número ↓ decrescente';
$('#ct').innerHTML=`<b>${l.length}</b> portaria(s) encontrada(s) de ${P.items.length}`;
$('#ls').innerHTML=l.slice(0,lim).map(p=>`<div class="it"><div><div class="n">${esc(p.num||'s/nº')}</div><div class="d">${dt(p.data)}</div></div><div><h3>${esc(p.ass||'—')}</h3><p>${p.env?'Servidor/envolvido: '+esc(p.env):''}${p.env&&p.resp?' · ':''}${p.resp?'Responsável: '+esc(p.resp):''}</p><span class="bg ${cls(p.sit)}">${esc(p.sit||'—')}</span></div>${/^https?:\/\//.test(p.link||'')?`<div class="acts"><button class="ab" data-u="${esc(p.link)}" onclick="lk(this.dataset.u)">Ver publicação</button><button class="ab ab2" data-u="${esc(p.link)}" onclick="cp(this.dataset.u);toast('Link copiado')">Copiar link</button></div>`:''}</div>`).join('')||'<div class="vz">Nenhuma portaria encontrada.</div>';
$('#mais').style.display=l.length>lim?'block':'none'}
function adminView(){
$('#pane').innerHTML=`<div class="card"><h2>Usuários da busca (login e senha)</h2><p class="mu" style="margin-top:0">Quem tiver login aqui entra só na <b>Consulta</b>. O perfil <b>Administrador</b> também acessa esta área. Para trocar a senha de alguém, cadastre o mesmo login novamente.</p><div class="ox"><table><tr><th>Login</th><th>Perfil</th><th></th></tr>${DATA.users.map(u=>`<tr><td><b>${esc(u.u)}</b></td><td>${u.r=='admin'?'Administrador':'Consulta'}</td><td>${u.u==SESS.u?'<span class="mu">você</span>':`<button class="dg" onclick="rmU('${esc(u.u)}')">${pendU==u.u?'Confirmar remoção?':'Remover'}</button>`}</td></tr>`).join('')}</table></div>
<div class="fg" style="margin-top:12px"><label>Login<input id="nu" autocomplete="off"></label><label>Senha (mínimo 8 caracteres)<input id="np" type="text" autocomplete="off"></label><label>Perfil<select id="nr"><option value="user">Consulta</option><option value="admin">Administrador</option></select></label></div><div class="bt"><button class="b1" onclick="addU()">Cadastrar / atualizar usuário</button></div><p id="um" class="mu"></p></div>
<div class="card"><h2>Atualizar portarias pelo Backup do sistema integrado</h2><p class="mu" style="margin-top:0">No sistema integrado, abra <b>Backup / Restaurar</b>, clique em <b>Copiar</b> e cole aqui. A busca tem hoje <b>${P.items.length}</b> portaria(s).</p><textarea id="imp" rows="4" placeholder="Cole aqui o texto do Backup"></textarea><div class="bt"><button class="b1" onclick="previa()">Conferir o Backup</button></div><div id="prev"></div></div>
<div class="card"><div class="pbx"><span id="pst" class="mu">${canPub()?'Neste endereço as alterações são publicadas sozinhas. Para o GitHub, baixe o index.html atualizado.':'Depois de atualizar, baixe o index.html atualizado e envie ao GitHub (Add file → Upload files).'}</span><span class="bt" style="margin:0">${canPub()?'<button onclick="pub()">Publicar no Claude</button>':''}<button class="b1" onclick="baixar()">Baixar index.html atualizado</button><button onclick="copiarCodigo()">Copiar código da página</button></span></div><div id="dla"></div></div>`}
function setMsg(t,er){const e=$('#pst');if(e){e.textContent=t;e.className=er?'er':'mu'}}
function touch(){P.upd=today();P.at=new Date().toISOString();clearTimeout(tm);if(canPub()){setMsg('Alterações ainda não publicadas…');tm=setTimeout(pub,2500)}else setMsg('Alterações feitas. Clique em "Baixar index.html atualizado" para gerar o arquivo novo.')}
async function addU(){const u=nu($('#nu').value),pw=$('#np').value,r=$('#nr').value,m=$('#um');if(!u||/\s/.test(u)){m.textContent='Informe um login sem espaços.';m.className='er';return}if(pw.length<8){m.textContent='A senha precisa ter pelo menos 8 caracteres.';m.className='er';return}
m.textContent='Cadastrando…';const raw=await crypto.subtle.exportKey('raw',DK),e=await mkUser(u,pw,r,raw),i=DATA.users.findIndex(x=>x.u==u);if(i>=0){if(DATA.users[i].r=='admin'&&r!='admin'&&DATA.users.filter(x=>x.r=='admin').length<2){m.textContent='Mantenha pelo menos um administrador.';m.className='er';return}DATA.users[i]=e}else DATA.users.push(e);touch();adminView();$('#um').textContent='Usuário "'+u+'" cadastrado. Informe a senha a ele por um canal seguro.'}
function rmU(u){if(pendU!=u){pendU=u;adminView();return}const x=DATA.users.find(y=>y.u==u);if(x&&x.r=='admin'&&DATA.users.filter(y=>y.r=='admin').length<2){pendU='';adminView();toast('Mantenha pelo menos um administrador.');return}DATA.users=DATA.users.filter(y=>y.u!=u);pendU='';touch();adminView()}
const CP=['num','data','ass','env','resp','rh','sig','sit','link'];let INC=[];
function previa(){const e=$('#prev');try{const j=JSON.parse($('#imp').value),a=(Array.isArray(j)?j:(j.portarias||[])).filter(p=>p&&p.num);if(!a.length)throw 0;
INC=a.map(p=>({num:String(p.num).trim(),data:p.data||'',ass:p.ass||'',env:p.env||'',resp:p.resp||'',rh:p.rh||'Não',sig:p.sig||'Não',sit:p.sit||'Rascunho',link:/^https?:\/\//.test(p.link||'')?p.link:''}));
const cur=new Map(P.items.map(x=>[x.num,x])),nw=INC.filter(x=>!cur.has(x.num)).length,ch=INC.filter(x=>cur.has(x.num)&&CP.some(k=>(x[k]||'')!=(cur.get(x.num)[k]||''))).length,inn=new Set(INC.map(x=>x.num)),so=P.items.filter(x=>!inn.has(x.num)).length;
e.innerHTML=`<p style="margin:14px 0 6px">O Backup tem <b>${INC.length}</b> portaria(s): <b>${nw}</b> nova(s), <b>${ch}</b> alterada(s). A busca tem <b>${so}</b> portaria(s) que não estão no Backup.</p><div class="bt" style="margin-top:6px"><button class="b1" onclick="aplicar('m')">Mesclar: acrescentar novas e atualizar alteradas</button><button class="dg" onclick="aplicar('s')">Substituir tudo pelo Backup${so?' (remove '+so+')':''}</button></div>`}
catch(x){e.innerHTML='<p class="er">Texto inválido: cole o conteúdo completo do Backup (precisa conter portarias).</p>'}}
function aplicar(m){const cur=new Map(P.items.map(x=>[x.num,x]));
if(m=='s')P.items=INC.map(x=>({id:(cur.get(x.num)||{}).id||uid(),...x}));
else INC.forEach(x=>{const o=cur.get(x.num);if(o)CP.forEach(k=>{if(x[k])o[k]=x[k]});else P.items.push({id:uid(),...x})});
INC=[];touch();adminView();setMsg('Portarias atualizadas: agora são '+P.items.length+'.')}
function buildHtml(){const S0='<scr'+'ipt',S1='<'+'/script>';return '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>'+TITLE+'</title><link href="'+FONTS+'" rel="stylesheet"><style id="css">'+$('#css').textContent+'</style></head><body><div id="app"></div>'+S0+' id="logo" type="text/plain">'+LOGO+S1+S0+' id="dados" type="application/json">'+JSON.stringify(DATA).replace(/</g,'\\u003c')+S1+S0+' id="main">'+$('#main').textContent+S1+'</body></html>'}
async function sealP(){DATA.p=await aesE(DK,enc.encode(JSON.stringify(P)))}
async function pub(){clearTimeout(tm);if(!DK){setMsg('Entre como administrador para atualizar.',1);return}
if(canPub()){try{await sealP()}catch(e){setMsg('Falha ao proteger os dados.',1);return}setMsg('Publicando…');try{await ART.publish(buildHtml());setMsg('Publicado ✓')}catch(e){setMsg('Não foi possível publicar ('+((e&&e.code)||'erro')+').',1)}return}
return baixar()}
async function baixar(){if(!DK){setMsg('Entre como administrador.',1);return}try{await sealP()}catch(e){setMsg('Falha ao proteger os dados.',1);return}
const h=buildHtml(),info=P.items.length+' portarias e '+DATA.users.length+' usuários';
let dk=null;try{dk=window.claude?await claude.use('downloads'):null}catch(e){dk=null}
if(dk){try{await dk.save({filename:'index.html',data:h});setMsg('Pedido de download enviado ('+info+'). Confirme na janela do Claude e depois envie o index.html ao GitHub.');return}catch(e){if(e&&e.code=='declined'){setMsg('Download cancelado.',1);return}}}
try{const u=URL.createObjectURL(new Blob([h],{type:'text/html'})),a=document.createElement('a');a.href=u;a.download='index.html';document.body.append(a);a.click();a.remove();const e=$('#dla');if(e)e.innerHTML=`<p class="mu" style="margin:12px 0 0">Arquivo gerado agora com ${info}. Se o download não começou, <a href="${u}" download="index.html"><b>clique aqui para baixar o index.html</b></a>.</p>`;setMsg('index.html atualizado gerado ('+info+'). Envie-o ao GitHub no lugar do antigo.')}catch(e){setMsg('O download direto não está disponível neste endereço. Abra a página pelo link do GitHub para baixar, ou use "Copiar código da página".',1)}}
async function copiarCodigo(){try{await sealP()}catch(e){setMsg('Falha ao proteger os dados.',1);return}cp(buildHtml());setMsg('Código copiado. No GitHub: abra o index.html, clique no lápis, selecione tudo, cole e confirme em Commit changes.')}
async function boot(){try{const k=sessionStorage.getItem('cp_k'),u=sessionStorage.getItem('cp_u');if(k&&u&&SUB()&&DATA.users.some(x=>x.u==u)){DK=await impK(ub(k));loadP(JSON.parse(dec.decode(await aesD(DK,DATA.p))));SESS={u,r:sessionStorage.getItem('cp_r')||'user'}}}catch(e){DK=null;P=null;SESS=null;try{sessionStorage.clear()}catch(_){}}
shell();try{if(window.claude){const[u,a]=await Promise.all([claude.use('user'),claude.use('artifact')]);if(u&&a){ART=a;WR=!!((await u.isOwner())||(await u.canEdit()));shell()}}}catch(e){}}
boot();
